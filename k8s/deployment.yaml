apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  namespace: simple-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
      - name: nodejs-app
        image: mosesade/nodejs-service:latest
        ports:
        - containerPort: 3000
      imagePullSecrets:
      - name: dockerhub-creds